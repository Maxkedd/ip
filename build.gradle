plugins {
    id 'application'
    id 'com.gradleup.shadow' version '9.6.1'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'Clanker'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Bundle application classes and runtime dependencies into one executable JAR.
tasks.named('shadowJar') {
    archiveFileName = 'clanker-all.jar'
}

tasks.named('run') {
    standardInput = System.in
}
